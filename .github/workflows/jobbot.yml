name: jobbot

on:
  schedule:
    - cron: "*/15 * * * *"   # перезапуск; каждый запуск сам работает ~50 минут, так что бот почти всегда онлайн
  workflow_dispatch: {}       # кнопка «Run workflow» — запустить вручную

concurrency:
  group: jobbot               # два запуска одновременно не пойдут — второй подождёт
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # База (что уже видели, кому уже писали) живёт в кэше GitHub между запусками
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobbot-state-${{ github.run_id }}
          restore-keys: jobbot-state-

      - name: Run one pass
        env:
          DATA_DIR: data
          OWNER_ID: ${{ secrets.OWNER_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOBBOT_PROFILE: ${{ secrets.JOBBOT_PROFILE }}
        run: python main.py --for 50

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: jobbot-state-${{ github.run_id }}
